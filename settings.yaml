simulation:
  injection_rate: 100          # particles injected per real second
  injection_radius_initial: 5.0    # starting radius (SU) — near zero, like the Big Bang
  injection_radius_expansion: 40.0 # how fast the injection zone grows (SU per sim-second)
  injection_velocity_max: 8.0  # max random initial speed (SU/s)
  time_step: 0.02              # simulation seconds per physics step
  steps_per_frame: 1           # physics steps per render frame
  max_particles: 1000          # smooth at 1000 on most hardware; see physics.py for numba upgrade

physics:
  gravity_constant: 8000.0     # scaled G; real G=6.674e-11 N·m²/kg², amplified for visibility
  softening_length: 40.0       # prevents force singularity at r→0 (SU)
  max_velocity: 2000.0         # velocity cap to prevent numerical blow-up (SU/s)

thermal:
  # --------------------------------------------------------------------------
  # Short-range repulsive pressure between hot, close particles.
  # Mimics ideal-gas pressure and creates hydrostatic equilibrium in dense
  # regions — the key ingredient that lets stars stabilise instead of collapsing
  # to a point.  Higher pressure_constant = stiffer gas = larger stable stars.
  # --------------------------------------------------------------------------
  pressure_constant: 0.4       # k_p: repulsion strength (scales with relative KE)
  pressure_cutoff: 200.0       # neighbourhood radius for pressure interactions (SU)

  # --------------------------------------------------------------------------
  # Van der Waals attraction — weak long-range pull between cold non-bonded
  # atoms.  Without this, inert atoms (He, Ne, Ar) and non-bonded neutrals
  # drift through each other forever.  With it, cold clouds condense into
  # liquid and solid phases (water and earth).  Competes directly with
  # thermal pressure: cold pair → VdW wins → condense; hot pair → pressure
  # wins → vapourise.
  # --------------------------------------------------------------------------
  vdw_strength: 25.0           # k_vdw: attractive strength (force ∝ k / r²)
  vdw_cutoff:   300.0          # max range (SU); inside covalent r_min skipped

  # --------------------------------------------------------------------------
  # Ionisation — energy required to strip an electron is taken per-element
  # from measured first-ionization-energy data (eV, NIST ASD). The single
  # scale below converts eV into the simulation's KE units; it exists only
  # because the sim runs in a custom time scaling.  With consistent SI units
  # it would vanish.
  # An atom ionises when KE > IE(element) × ionization_energy_scale, breaks
  # its bonds, cannot reform any, and repels other ions more strongly.
  # Hysteresis: an ionised atom recombines once KE drops below
  # recombination_fraction × its own ionization threshold.
  # --------------------------------------------------------------------------
  ionization_energy_scale: 36770.0   # sim KE per 1 eV of ionization energy
  recombination_fraction:  0.2       # recombine when KE < fraction × IE_threshold
  plasma_repulsion_factor: 2.0       # extra multiplier on thermal pressure for ion-ion pairs

chemistry:
  bond_formation_factor: 1.4   # form bond when dist < factor * (rc_i + rc_j)
  bond_velocity_threshold: 60.0  # max relative speed to allow bonding (SU/s)
  bond_spring_constant: 0.8    # Morse well spring constant k (energy/SU²)
  # Bond dissociation energy uses Pauling's real formula
  #   D(A-B) = √(D_AA·D_BB) + 96·(χ_A−χ_B)²   [kJ/mol]
  # with measured D(X-X) and electronegativities from elements.py. The scale
  # below is the sole remaining knob: a unit conversion (sim energy / kJ·mol⁻¹)
  # that exists only because the sim runs in custom energy units. Calibrated
  # so H-H bond depth ≈ old 80 sim-energy: scale = 80 / 436 ≈ 0.184.
  bond_energy_scale: 0.184
  bond_break_factor: 2.8       # break bond when dist > factor * equilibrium_length
  # Nuclear fusion is gated by the classical Coulomb barrier:
  #   V_C = coulomb_barrier_scale · Z₁·Z₂ / (r₀·(A₁^⅓ + A₂^⅓))
  # where r₀ = 1.2 fm is the standard nuclear-radius constant (Krane 1988).
  # The *form* is real physics; the scale converts (sim_KE × fm) and exists
  # only because the sim runs in custom time-scaled units.  The relative
  # barrier heights across element pairs (H+H easiest, scales with Z₁·Z₂)
  # are physically correct regardless of the scale value.
  # Gamow tunnelling is NOT yet modelled — tracked on issue #11.
  coulomb_barrier_scale: 9600.0   # sim KE × fm  (calibrates H+H barrier ≈ 4000)
  fusion_enabled: true

  # Q-value scaling — converts (amu mass deficit) into sim KE units so the
  # energy-conservation check (rel_KE + Q ≥ 0) is dimensionally consistent.
  # The Q-values themselves come from real AME 2020 measured isotope masses.
  q_value_scale: 1.0

  # Radiation pressure feedback from each fusion event.
  # Each fusion emits an outward velocity kick to nearby particles, falling off
  # as 1/r.  This is the stellar thermostat: more fusion → more radiation →
  # surrounding gas heats up → thermal pressure rises → expansion → less fusion.
  radiation_radius: 600.0      # how far the kick reaches (SU)
  radiation_energy_scale: 150.0  # kick magnitude at 1 SU distance (SU²/s)

reactions:
  # --------------------------------------------------------------------------
  # Phase-4 chemical reactions — electronegativity-driven bond swaps.
  # For each existing bond, looks at every atom in a neighbouring search
  # radius; if any candidate offers a more thermodynamically stable bond
  # (higher Pauling D), the swap occurs with probability
  #     P = 1 − exp(−ΔE / activation_energy_scale)
  # and the released energy ΔE × heat_release_scale is injected as relative
  # KE into the (departing-partner, new-partner) pair with full momentum
  # conservation.  Set reaction_radius to 0 to disable reactions entirely.
  # --------------------------------------------------------------------------
  reaction_radius:          150.0    # SU — pairs within this distance considered
  activation_energy_scale:  200.0    # kJ/mol — Arrhenius-like rate scale
  heat_release_scale:         0.5    # ΔE [kJ/mol] → sim KE for the j-k kick

accretion:
  # --------------------------------------------------------------------------
  # Gravitational accretion: two non-fusable particles that are gravitationally
  # bound (relative KE < mutual gravitational PE) merge into one body, conserving
  # momentum.  Rocky elements (C, O, Si, Fe …) accrete into planetesimals and
  # planets; fusable elements (H, He) fuse via nuclear reactions instead.
  # --------------------------------------------------------------------------
  accretion_radius: 100.0      # max separation for a merge to occur (SU)

cosmology:
  # --------------------------------------------------------------------------
  # These are INITIAL CONDITIONS given to each particle at birth.
  # No ongoing forces are added — gravity does everything after.
  # --------------------------------------------------------------------------

  # Hubble initial velocity: each particle is born moving outward at a speed
  # proportional to its distance from the origin.  This is the Big Bang
  # initial condition — the universe was born expanding.
  # Units: (SU/s) per SU of distance from origin.  0 = disabled.
  hubble_initial: 0.006

  # Primordial density perturbations: a handful of overdense seed regions bias
  # where particles are born (analogous to quantum fluctuations during inflation).
  # Gravity amplifies these → separate collapsing clouds → tidal torques between
  # neighbouring clouds → angular momentum emerges naturally (tidal torque theory).
  # 0 seeds = uniform injection (no structure formation).
  n_density_seeds: 8

  # How much denser the seed regions are vs the background.
  perturbation_amplitude: 5.0

  # Size of each seed region as a fraction of the current injection radius.
  perturbation_scale: 0.25

injection:
  # Cosmic abundances by particle number fraction (must sum to ~100)
  # Based on Solar System composition data
  elements:
    H:  73.9
    He: 24.0
    O:  1.04
    C:  0.46
    Ne: 0.13
    Fe: 0.109
    N:  0.096
    Si: 0.065
    Mg: 0.058
    S:  0.044
    Ar: 0.015
    Ca: 0.009
    Ni: 0.005

renderer:
  width: 1280
  height: 720
  background: [0.02, 0.02, 0.06]
  particle_size_base: 5.0      # base render size (px)
  particle_size_scale: 0.08    # size scales with atomic radius: base + scale * cov_radius
  show_bonds: true
  bond_alpha: 0.45
  camera_distance: 3000.0
  fov: 60.0
  show_hud: true               # show stats overlay (particle count, bonds, etc.)

  # Body rendering — appearance is driven purely by accumulated mass ratio.
  # No hardcoded "this is a star" flag: if mass / element_mass >= threshold,
  # the colour and size automatically switch to the planet or star palette.
  planet_mass_threshold: 20.0  # mass_ratio above which a particle renders as a planet
  star_mass_threshold: 200.0   # mass_ratio above which a particle renders as a star
  body_size_scale: 3.0         # size = body_size_scale × cbrt(mass_ratio)  (px)

  # KE at which colour blends fully to "hot" (orange-red). 0 disables the tint.
  hot_temperature_threshold: 500000.0

  # Renderer calibration: when a particle's KE equals hot_temperature_threshold,
  # its effective physical temperature is taken to be this many Kelvin. The
  # blackbody-RGB function and Stefan-Boltzmann halo sizing use this mapping;
  # the value here corresponds to a hot B-class star photosphere.
  reference_temperature_K: 20000.0

  # Reflected-illumination albedo: fraction of received starlight that
  # scatters back toward the observer.  Real interstellar dust albedo
  # is 0.6–0.8 in the visual (Calzetti 2001); 0.7 is the standard value.
  illumination_albedo: 0.7

  # HDR exposure (Reinhard tone-mapping operator). Higher exposure brightens
  # dim sources; lower exposure prevents bright sources from clipping. Same
  # control a photographer uses. Real long-exposure astrophotography uses
  # very high effective exposure to bring out dim nebulae.
  render_exposure: 3.0

  # Beer-Lambert extinction — cold gas in the line of sight absorbs light
  # from emitters behind it (F_obs = F_emitted · exp(−τ)).  Produces the
  # dark-nebula silhouettes (Horsehead, Coalsack) and dims foreground-gas-
  # backed stars.  Set extinction_opacity to 0 to disable.
  extinction_opacity:    0.05    # per-particle optical-depth contribution
  extinction_kernel_sigma: 30.0  # perpendicular-distance falloff (SU)
